name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# A newer push cancels the older run, so two quick pushes can never publish
# two different builds and the version sync below never races itself.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows NSIS
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Every push to main ships a new patch release automatically, so the
      # published version is always unique. Tag builds keep their version.
      - name: Auto-bump patch version
        if: github.ref_type == 'branch'
        run: |
          npm version patch --no-git-tag-version
          $v = node -p "require('./package.json').version"
          echo "NEW_VERSION=$v" >> $env:GITHUB_ENV

      # canvas is an unused optional peer of pdfjs-dist and would demand a
      # native toolchain; nothing else optional is needed at package time.
      - name: Install dependencies
        run: npm ci --omit=optional

      - name: Run tests
        run: npm test

      - name: Build and publish Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish always

      # Push the bumped version back so the repo never drifts from releases.
      # [skip ci] keeps this sync commit from triggering another release.
      # Best-effort: the release is already published at this point, so a
      # lost race here only means the next run bumps from latest instead.
      - name: Sync bumped version back to main
        if: github.ref_type == 'branch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: auto-bump version to $env:NEW_VERSION [skip ci]"
          git pull --rebase origin main
          if ($LASTEXITCODE -ne 0) {
            git rebase --abort
            echo "sync skipped: remote moved, next run will bump from it"
            exit 0
          }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) {
            echo "sync push lost the race, next run will bump from latest"
            exit 0
          }
